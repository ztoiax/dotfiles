# 默认配置 https://github.com/mpv-player/mpv/blob/master/etc/input.conf
# mpv --input-test --force-window --idle命令可以查看快捷键

# 前进和后退
# l seek 9
# h seek -9
# k seek -59
# j seek 59

# RIGHT  seek 4
# LEFT   seek -4
# ctrl+a seek -4
# ctrl+d seek 4
# a      seek -4
# d      seek 4

# 退出
q quit
ESC quit
ctrl+w quit

# 全屏
ENTER cycle fullscreen
w cycle fullscreen

# 倍速
# - add speed -0.25
# + add speed 0.25
# = set speed 1.0

# 前进1帧和后退1帧
. frame-step
, frame-back-step

# 截图
# ctrl+s screenshot

# 对比度
1 add contrast -1
2 add contrast 1
# 亮度
3 add brightness -1
4 add brightness 1
# 伽马
5 add gamma -1
6 add gamma 1
# 饱和度
7 add saturation -1
8 add saturation 1

# 播放上下一个视频
# > playlist-next                        # skip to next file
# < playlist-prev                        # skip to previous file

# 音量
# UP add volume +5
# DOWN add volume -5

# # 向前滚轮音量加5
# AXIS_UP add volume 5
# # 向后滚轮音量减5
# AXIS_DOWN  add volume -5

# 旋转
Alt+LEFT script-message Cycle_Video_Rotate "counter-clockwise"
Alt+RIGHT script-message Cycle_Video_Rotate "clockwise"
ctrl+k script-message Cycle_Video_Rotate "clockwise"

# 显示统计信息
i script-binding stats/display-stats-toggle

# ab_repeat.lua插件。循环播放
Ctrl+j script-binding set-a-point
Ctrl+k script-binding set-b-point
Ctrl+h script-binding save-ab-range
Ctrl+l script-binding load-ab-range-menu

# sub-export.lua。导出内封字幕
Ctrl+x script-binding export-selected-subtitles

# chapter-make-read.lua。导出章节chp文件
c script-message-to chapter_make_read create_chapter
# C  script-message-to chapter_make_read write_chapter chp
C script-message-to chapter_make_read load_chapter

# whispersubs.lua。根据语音生成字幕
Ctrl+. script-binding whispersubs-whisper_subs

# mpv360.lua。Interactive 360° Video Viewer for mpv
Ctrl+r script-binding toggle

# uosc。
tab script-binding uosc/toggle-ui
space cycle pause; script-binding uosc/flash-pause-indicator

# 前进和后退
l seek 9; script-binding uosc/flash-timeline
h seek -9; script-binding uosc/flash-timeline
k seek -59; script-binding uosc/flash-timeline
j seek 59; script-binding uosc/flash-timeline

RIGHT  seek 4; script-binding uosc/flash-timeline
LEFT   seek -4; script-binding uosc/flash-timeline
a      seek -4; script-binding uosc/flash-timeline
d      seek 4; script-binding uosc/flash-timeline

# 音量
up     no-osd add volume  5; script-binding uosc/flash-volume
down   no-osd add volume -5; script-binding uosc/flash-volume
AXIS_UP     no-osd add volume  5; script-binding uosc/flash-volume
AXIS_DOWN   no-osd add volume -5; script-binding uosc/flash-volume
M           no-osd cycle mute; script-binding uosc/flash-volume

# 倍速
- no-osd add speed -0.25; script-binding uosc/flash-speed
+ no-osd add speed  0.25; script-binding uosc/flash-speed
= no-osd set speed  1.0; script-binding uosc/flash-speed

# 播放上下一个视频
> script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline
< script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline

# 菜单
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
R    script-message-to uosc show-submenu "Utils > Aspect ratio"
s           script-binding uosc/subtitles          #! Subtitles
A           script-binding uosc/audio              #! Audio tracks
Q           script-binding uosc/stream-quality     #! Stream quality
p           script-binding uosc/items              #! Playlist
# c           script-binding uosc/chapters           #! Chapters
o           script-binding uosc/open-file          #! Navigation > Open file
ctrl+s      async screenshot                       #! Utils > Screenshot
K           script-binding uosc/keybinds           #! Utils > Key bindings
O           script-binding uosc/show-in-directory  #! Utils > Show in directory

# uosc_danmaku。弹幕功能和弹幕搜索
Ctrl+d script-message show_danmaku_keyboard
Ctrl+D script-message open_search_danmaku_menu

# acompressor.lua插件。音频动态压缩，平衡音量，避免对话太小、爆炸音效突然巨响，夜间观影很实用。
m script-binding toggle-acompressor

# mouse_fast_play.lua插件。鼠标长按倍速播放
MBTN_LEFT script-binding hold_fast
/ script-binding hold_fast

# mpv-easy-copy-screen.js插件。复制当前播放进度
CTRL+c     script-message copy-screen
# mpv-easy-clipboard-play.js插件。复制粘贴播放http视频
CTRL+v     script-message clipboard-play
# Ctrl+v  loadfile ${clipboard/text} append-play; show-text '+ ${clipboard/text}'

# mpvDLNA插件。可以看光猫的宽带电视
ctrl+b script-binding toggle_mpvDLNA
; script-binding text_mpvDLNA
: script-binding command_mpvDLNA


# mpv-quality-menu.lua插件。选择视频分辨率菜单ui
F     script-binding quality_menu/video_formats_toggle #! Stream Quality > Video
Alt+f script-binding quality_menu/audio_formats_toggle #! Stream Quality > Audio


# firequalizer15.lua插件。提供一个线性相位的均衡器，可以精细调整各个频段的声音，自定义听感。
Ctrl+e script-binding firequalizer15-toggle_control
