# 默认的yazi.toml https://github.com/sxyazi/yazi/blob/main/yazi-config/preset/yazi-default.toml

# 插件 https://github.com/AnirudhG07/awesome-yazi

[mgr]
# 父级宽度为1/8，当前宽度为3/8，预览宽度为4/8
ratio          = [ 1, 4, 3 ]
# ratio            = [1, 2, 5]

# 默认按字母排序
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
sort_fallback  = "alphabetical"
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]
title_format   = "Yazi: {cwd}"

[preview]
wrap            = "no"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
# orphan：即使Yazi已经退出，也保持进程运行，一旦指定，进程将从任务调度系统中分离。


# 以阻塞方式打开。设置后，yazi将隐藏到一个副屏幕，并显示在主屏幕上的程序，直到它退出。在此期间，它可以接收I/O信号，这对交互式程序很有用。
edit = [
  { run = '$EDITOR %s1', block = true, desc = "new nvim", for = "unix" },
  { run = 'nvim --server /tmp/nvim.socket --remote $@', block = true, desc = "current nvim", for = "unix" },
  { run = 'code %s1', orphan = true, desc = "vscode", for = "unix" },
  { run = 'zeditor %s1', orphan = true, desc = "zeditor", for = "unix" },
  { run = 'helix %s1', orphan = true, desc = "helix", for = "unix" },
]
open = [
  { run = 'xdg-open %s1',                                              desc = "Open", for = "linux" },
  { run = 'open %s1',                                                  desc = "Open", for = "macos" },
  { run = 'start "" %s1', orphan = true,                               desc = "Open", for = "windows" },
	{ run = "termux-open %s1", desc = "Open", for = "android" },
  { run = 'nvim --server /tmp/nvim.socket --remote %s1', block = true, desc = "current nvim", for = "unix" },
  { run = '$EDITOR %s1', block = true,                                 desc = "new nvim", for = "unix" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', orphan = true, desc = "Reveal", for = "linux" },
  { run = 'open -R "$1"', orphan = true,          desc = "Reveal", for = "macos" },
  { run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
	{ run = 'termux-open "$(dirname "$1")"',        desc = "Reveal", for = "android" },
  { run = '''exiftool "$1"; echo -e "\033[31mPress enter to exit\033[0m"; read _''', block = true,      desc = "Show EXIF", for = "unix" },
]
open_image = [
  { run = 'qimgv %s1', orphan = true, desc = "qimgv" },
  { run = 'nomacs --fullscreen %s1', orphan = true, desc = "nomacs" },
  { run = 'nsxiv %s1', orphan = true, desc = "nsxiv" },
  { run = 'swayimg --fullscreen %s1', orphan = true, desc = "swayimg" },
  { run = 'pix %s1', orphan = true, desc = "pix" },
]
extract = [
  # { run = 'engrampa "$@"', orphan = true, desc = "open with engrampa", for = "unix" },
  { run = 'peazip %s1', orphan = true, desc = "open with peazip", for = "unix" },
  { run = 'myx.sh %s1', desc = "Extract here with myx.sh", for = "unix" },
  { run = 'ouch d -y %s1', desc = "Extract here with ouch", for = "unix" },
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]

download = [
	{ run = "ya emit download --open %S", desc = "Download and open" },
	{ run = "ya emit download %S",        desc = "Download" },
]

trash = [
	{ run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
	{ run = "ya pub trash-empty --list %S",   desc = "Empty trash bin" },
]

pdf = [
  { run = 'zathura --mode fullscreen %s1', orphan = true, desc = "zathura" },
  { run = 'sioyek %s1', orphan = true, desc = "sioyek" },
  { run = 'readest %s1', orphan = true, desc = "readest" },
  { run = 'foliate %s1', orphan = true, desc = "foliate" },
]

play = [
	{ run = "mpv --force-window %s1",  desc = "mpv", for = "linux", orphan = true },
	{ run = "vlc --fullscreen %s1",    desc = "vlc", for = "linux", orphan = true },
  { run = 'ghb $s1', orphan = true, desc = "HandBrake视频gui", for = "unix" },

  { run = 'xdg-open %s1', orphan = true, desc = "Open with xdg-open" },
  # { run = '''mediainfo %s1; echo -e "\033[31mPress enter to exit\033[0m"; read _''', block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
	{ run = "mediainfo %s1 & pause", block = true, desc = "Show media info", for = "windows" },
  { run = '''ffprobe %s1; echo -e "\033[31mPress enter to exit\033[0m"; read _''', block = true, desc = "Show media ffprobe", for = "unix" },
  { run = 'mediainfo-gui %s1', orphan = true, desc = "Show media info gui", for = "unix" },
  { run = 'winff-qt6 %s1', orphan = true, desc = "Show media ffprobe gui", for = "unix" },
]

[open]
rules = [
  # Trash
  # { url = "trash://*", use = [ "open", "trash" ] },
  # { url = "trash://*/", use = [ "edit", "trash" ] },
  # Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  # Image
  { mime = "image/*", use = [
    "open_image",
    "reveal",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },

	# Code
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [ "edit", "reveal" ] },
  # Archive
  # { mime = "application/{zst,zstd,zip,rar,7z*,tar,gzip,gz,xz,bz,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,octet-stream,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  # pdf、epub、mobi
  { mime = "application/{pdf,epub+zip,x-mobipocket-ebook}", use = "pdf" },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", use = "download" },
  # Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
# micro_workers    = 10
# macro_workers    = 10
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false

prepend_rules = []
# 始终优先于默认的优先级规则。
append_rules = []

[plugin]
# https://yazi-rs.github.io/docs/resources/
# https://github.com/AnirudhG07/awesome-yazi

append_previewers = [
  # binary二进制文件
  # { mime = "*", run = "readelf" },
]

fetchers = [
	# MIME-type
	{ url = "*/",         run = "mime.dir",    prio = "high", group = "mime" },
	{ url = "local://*",  run = "mime.local",  prio = "high", group = "mime" },
	# { url = "trash://*",  run = "mime.local",  prio = "high", group = "mime" },
	{ url = "remote://*", run = "mime.remote", prio = "high", group = "mime" },
]

spotters = [
	# Multi-file
	{ mime = "multi/*", run = "multi" },
	# Folder
	{ url = "*/", run = "folder" },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]

# prepend_spotters = [
#   { name = "video/*", run = "spot-video" },
#   { name = "audio/*", run = "spot-audio" },
# ]

preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/{pdf,epub+zip,x-mobipocket-ebook}", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
]

previewers = [
	{ url = "*/", run = "folder" },
	# Code
  { mime = "text/*", run = "code" },
  { mime = "*/xml", run = "code" },
  { mime = "*/cs", run = "code" },
  { mime = "*/javascript", run = "code" },
  { mime = "*/x-wine-extension-ini", run = "code" },
  { mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
  # Image
  { mime = "image/{avif,hei?,jxl}", run = "magick" },
  { mime = "image/svg+xml", run = "svg" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/{pdf,epub+zip,x-mobipocket-ebook}", run = "pdf" },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", run = "archive" },
  { mime = "application/{debian*-package,redhat-package-manager,rpm,android.package-archive}", run = "archive" },
  { url = "*.{AppImage,appimage}", run = "archive" },
  # Virtual Disk / Disk Image
  { mime = "application/{iso9660-image,qemu-disk,ms-wim,apple-diskimage}", run = "archive" },
  { mime = "application/virtualbox-{vhd,vhdx}", run = "archive" },
  { url = "*.{img,fat,ext,ext2,ext3,ext4,squashfs,ntfs,hfs,hfsx}", run = "archive" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/ms-opentype", run = "font" },
  # Empty file
  { mime = "inode/empty", run = "empty" },
	# Virtual file system
	{ mime = "vfs/*", run = "vfs" },
	# Error
	{ mime = "null/*", run = "null" },

  # { name = "*.md", run = "glow" },  # for markdown (.md) files
  { mime = "*.md", run = "code" },
  { mime = "*.rst", run = "rich-preview" },       # for restructured text (.rst) files
  { mime = "*.ipynb", run = "rich-preview" },     # for jupyter notebooks (.ipynb)
  { mime = "*.lang_type", run = "rich-preview" }, # for particular language files eg. .py, .go., .lua, etc.

  { mime = "audio/*", run = "exifaudio" },
  { mime = "application/x-bittorrent", run = "torrent-preview" },
	# Fallback
	{ url = "*", run = "file" },

  # 需要安装enhance-piper插件
  { mime = "*", run  = 'enhance-piper -- echo "$1"' },

]

[input]
cursor_blink = false

# cd
cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# delete
delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

# overwrite
overwrite_title = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

# quit
quit_title = "Quit?"
quit_body   = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
